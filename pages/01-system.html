.bat{display:inline-block;margin-left:1.2rem;font-size:1.05rem;font-weight:600;letter-spacing:0;vertical-align:middle;position:relative;top:-.15rem;}
.batbox{display:inline-block;position:relative;width:2.2rem;height:1.1rem;border-width:.15rem;border-style:solid;-webkit-border-radius:.25rem;border-radius:.25rem;margin-right:.5rem;vertical-align:middle;top:-.1rem;}

#batfill{position:absolute;left:.1rem;top:.1rem;bottom:.1rem;-webkit-border-radius:.1rem;border-radius:.1rem;}

.clock{position:absolute;right:0;top:-.25rem;}
.date{float:left;text-align:right;margin:.9rem 1.4rem 0 0;}
#dow{font-size:1.15rem;font-weight:700;letter-spacing:.16rem;}
#dmy{font-size:1.15rem;margin-top:.35rem;letter-spacing:.06rem;}
#time{float:left;font-size:4.7rem;font-weight:200;line-height:4.7rem;letter-spacing:-.1rem;}
#sec{font-size:1.6rem;margin-left:.45rem;font-weight:400;letter-spacing:0;}

.card{position:absolute;overflow:hidden;-webkit-transition:opacity .4s;transition:opacity .4s;}
.ch{position:absolute;left:1.3rem;right:1.3rem;top:1.1rem;height:1.6rem;line-height:1.6rem;font-size:1.05rem;white-space:nowrap;}
.ch .dot{width:.7rem;height:.7rem;margin-right:.6rem;top:-.1rem;}
.lbl{font-weight:700;letter-spacing:.18rem;}
.chr{position:absolute;right:0;top:0;font-weight:500;max-width:11rem;overflow:hidden;text-overflow:ellipsis;}

canvas{display:block;}
canvas.gauge{position:absolute;left:.9rem;top:3.1rem;width:10rem;height:10rem;}
.gv{position:absolute;left:.9rem;top:3.1rem;width:10rem;text-align:center;padding-top:3.35rem;}
.gnum{font-size:3.1rem;font-weight:600;line-height:3.2rem;letter-spacing:-.05rem;white-space:nowrap;}
.gu{font-size:1.4rem;margin-left:.15rem;font-weight:500;letter-spacing:0;}
.gs{font-size:1.05rem;margin-top:.15rem;font-weight:600;}
.kv{position:absolute;left:11.9rem;top:3.6rem;width:7.2rem;}
.row{height:2.85rem;}
.k{font-size:.9rem;letter-spacing:.08rem;line-height:1.1rem;white-space:nowrap;}
.v{font-size:1.4rem;font-weight:600;line-height:1.7rem;white-space:nowrap;}
.v small,.nv small{font-size:.95rem;font-weight:500;margin-left:.2rem;}
.cores{position:relative;height:2.7rem;margin-top:.4rem;}

.core i{position:absolute;left:0;right:0;bottom:0;display:block;-webkit-transition:height .5s;transition:height .5s;}
canvas.spark{position:absolute;left:0;bottom:0;}

.nb{position:absolute;top:3.4rem;}
.nv{font-size:2.7rem;font-weight:600;line-height:3.1rem;letter-spacing:-.05rem;white-space:nowrap;}
.tri{display:inline-block;width:0;height:0;border-left:.42rem solid transparent;border-right:.42rem solid transparent;margin-right:.45rem;position:relative;top:-.1rem;}

.drv{position:absolute;left:1.3rem;right:1.3rem;}
.dl{font-size:1.1rem;height:1.5rem;line-height:1.5rem;font-weight:700;}
.dl em{font-style:normal;}
.dl em small{font-weight:500;}
.dl span{float:right;font-size:1rem;font-weight:500;}
.bar{height:.5rem;overflow:hidden;margin-top:.3rem;}
.bar i{display:block;height:100%;-webkit-transition:width .6s;transition:width .6s;}
.io{position:absolute;left:1.3rem;right:1.3rem;bottom:1rem;font-size:1rem;white-space:nowrap;}

.pr{position:relative;height:1.44rem;line-height:1.44rem;font-size:1.05rem;margin-bottom:.05rem;}

.pc{position:absolute;right:.5rem;top:0;font-weight:600;}

    </div>
    <canvas class="spark" id="s-ram" data-w="20" data-h="3.4"></canvas>
  </div>

  <div class="card" style="left:42.8rem;top:6.4rem;width:20rem;height:17rem;">
    <div class="ch"><span class="dot d-gpu"></span><span class="lbl" data-l="GPU">GPU</span><span class="chr" id="gpu-name"></span></div>
    <canvas class="gauge" id="g-gpu" data-w="10" data-h="10"></canvas>
    <div class="gv"><div class="gnum"><span id="gpu-v">0</span><span class="gu">%</span></div><div class="gs">3D</div></div>
    <div class="kv">
      <div class="row"><div class="k">VIDEO</div><div class="v" id="gpu-dec">–</div></div>
      <div class="row"><div class="k">COPY</div><div class="v" id="gpu-copy">–</div></div>
      <div class="row"><div class="k">BỘ NHỚ</div><div class="v" id="gpu-mem">–</div></div>
    </div>
    <canvas class="spark" id="s-gpu" data-w="20" data-h="3.4"></canvas>
  </div>

  <div class="card" style="left:1.2rem;top:24.2rem;width:24.4rem;height:10.6rem;">
    <div class="ch"><span class="dot d-down"></span><span class="lbl" data-l="MẠNG">MẠNG</span><span class="chr" id="net-if" style="max-width:15rem"></span></div>
    <div class="nb" style="left:1.3rem"><div class="k"><span class="tri dn"></span>TẢI XUỐNG</div><div class="nv" id="net-down">–</div></div>
    <div class="nb" style="left:12.8rem"><div class="k"><span class="tri up"></span>TẢI LÊN</div><div class="nv" id="net-up">–</div></div>
    <canvas class="spark" id="s-net" data-w="24.4" data-h="3.2"></canvas>
  </div>

    <div class="drv" id="drv0" style="top:3.3rem"><div class="dl"><em id="drv0-n"></em><span id="drv0-t"></span></div><div class="bar"><i id="drv0-b"></i></div></div>

    <div class="io"><span>ĐỌC <b id="disk-r">–</b></span><span class="r">GHI <b id="disk-w">–</b></span></div>
  </div>

  <div class="card" style="left:44rem;top:24.2rem;width:18.8rem;height:10.6rem;">

    <div class="plist" id="plist"></div>
  </div>

  <div id="toast"></div>
</div>

    html('ram-total', gb(r.total || 0) + ' GB');
    html('ram-used', gb(r.used || 0) + '<small>GB</small>');
    html('ram-free', gb(r.free || 0) + '<small>GB</small>');
    html('ram-commit', gb(r.commit || 0) + '<small>/ ' + Math.round((r.commitLimit || 0) / 1073741824) + '</small>');

    var g = d.gpu || {};
    G.gpu.tgt = g.load || 0;
    html('gpu-v', String(g.load || 0));
    html('gpu-name', esc(g.name || ''));
    html('gpu-dec', (g.decode || 0) + '<small>%</small>');
    html('gpu-copy', (g.copy || 0) + '<small>%</small>');
    html('gpu-mem', bytes(g.mem || 0));

    var n = d.net || {};
    html('net-down', bytes(n.down, true));
    html('net-up', bytes(n.up, true));
    html('net-if', esc(d.iface || '') + (d.ssid ? ' · ' + esc(d.ssid) : ''));

    var k = d.disk || {}, drv = k.drives || [], i;
    html('disk-busy', 'Hoạt động ' + (k.busy || 0) + '%');
    html('disk-r', bytes(k.read, true));
    html('disk-w', bytes(k.write, true));
    for (i = 0; i < 2; i++) {
      var x = drv[i];
      if (!x) { $('drv' + i).className = 'drv hide'; continue; }
      $('drv' + i).className = 'drv';
      var used = x.size - x.free, p = Math.round(used / x.size * 100);
      html('drv' + i + '-n', esc(x.id) + ' <small>' + p + '%</small>');
      html('drv' + i + '-t', Math.round(used / 1073741824) + ' / ' + Math.round(x.size / 1073741824) + ' GB');
      var b = $('drv' + i + '-b');
      b.style.width = p + '%';
      b.style.background = p >= 90 ? T.hot[1] : T.disk;
      b.parentNode.style.background = barCol();
    }

    var t = d.top || [], mx = 10;
    for (i = 0; i < t.length; i++) mx = Math.max(mx, t[i].c);
    for (i = 0; i < 5; i++) {
      var q = t[i];
      html('pn' + i, q ? esc(q.n) : '');
      html('pc' + i, q ? q.c.toFixed(1) + '%' : '');
      $('pb' + i).style.width = q ? Math.max(1, q.c / mx * 100) + '%' : '0';
    }

    if (!redraw) {
      push('cpu', c.load || 0); push('ram', rp); push('gpu', g.load || 0);
      push('down', n.down || 0); push('up', n.up || 0);
      kick(); drawSparks();
    }
  }

  // =================================================================== polling
  var lastOk = 0;
  function setLive(ok) {
    $('live').className = 'dot ' + (ok ? 'on' : 'bad');
    app.className = ok ? '' : 'off';
    if (!ok) { $('hsub').innerHTML = 'Mất kết nối tới máy chủ – đang thử lại…'; cache.hsub = null; $('hsub').className = 'hsub err'; }
  }
  function poll() {
    var done = false, x = new XMLHttpRequest();
    var to = setTimeout(function () { if (!done) x.abort(); }, 5000);
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || done) return;
      done = true; clearTimeout(to);
      var ok = false;
      if (x.status === 200) {
        try { var d = JSON.parse(x.responseText); if (d && d.cpu) { update(d); ok = true; } } catch (e) {}
      }
      if (ok) { lastOk = +new Date(); setLive(true); }
      else if (+new Date() - lastOk > 6000) setLive(false);
      setTimeout(poll, POLL);
    };
    x.open('GET', '/api/stats?_=' + (+new Date()), true);
    x.send(null);
  }

  // =================================================================== start
  var m = /[?&]theme=([\w-]+)/.exec(location.search);
  var start = FIXED_THEME ? findTheme(FIXED_THEME) : (m ? findTheme(m[1]) : findTheme(store('ms-theme') || ''));
  applyTheme(start < 0 ? 0 : start, false);
  layout();
  clock();
  poll();
})();
</script>
</body>
